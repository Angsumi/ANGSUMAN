<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greater Rangachakua Flood Relief - Expense Report</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #060913;
            --bg-secondary: #0d1222;
            --bg-tertiary: #171f38;
            --accent-primary: #ec4899; /* Pink/Rose for expenses */
            --accent-secondary: #f43f5e;
            --accent-gradient: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border-color: #1e293b;
            --danger: #f43f5e;
            --glass-bg: rgba(13, 18, 34, 0.75);
            --glass-border: rgba(255, 255, 255, 0.05);
            --shadow-lg: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        header {
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-logo i {
            color: var(--accent-primary);
        }

        .header-logo h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background: #202b4d;
            transform: translateY(-1px);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            border-left: 3px solid var(--accent-primary);
            padding-left: 0.75rem;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.25rem;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(236, 72, 153, 0.1);
            color: var(--accent-primary);
        }

        .stat-card:nth-child(2) .stat-icon {
            background: rgba(244, 63, 94, 0.1);
            color: var(--accent-secondary);
        }

        .stat-card:nth-child(3) .stat-icon {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        .stat-details h3 {
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
        }

        /* Layout Grid */
        .layout-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            width: 100%;
            height: 300px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: rgba(23, 31, 56, 0.5);
            padding: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .amount-col {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <i data-lucide="calculator" size="28"></i>
            <h1>Greater Rangachakua Flood Relief - Expense Statement</h1>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn btn-secondary">
                <i data-lucide="arrow-left"></i> View Donations
            </a>
        </div>
    </header>

    <div class="container">
        
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i data-lucide="credit-card"></i>
                </div>
                <div class="stat-details">
                    <h3>Total Disbursed</h3>
                    <div id="statTotalDisbursed" class="stat-value">₹0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i data-lucide="tag"></i>
                </div>
                <div class="stat-details">
                    <h3>Expense Categories</h3>
                    <div id="statCategories" class="stat-value">0 Items</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i data-lucide="sigma"></i>
                </div>
                <div class="stat-details">
                    <h3>Average Cost</h3>
                    <div id="statAvgCost" class="stat-value">₹0</div>
                </div>
            </div>
        </div>

        <div class="layout-grid">
            <!-- Table Card -->
            <div class="card">
                <div class="card-title">Expense Ledger</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th> relief Item / Service</th>
                                <th style="text-align: right;">Amount (INR)</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="card">
                <div class="card-title">Disbursement Distribution</div>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Init Lucide
        lucide.createIcons();

        // Expenses database (Updated Lunch cost to 2342)
        const expenses = [
            { item: "Water Bottle Case", amount: 2400 },
            { item: "Grocery", amount: 49000 },
            { item: "Mosquito Net", amount: 21900 },
            { item: "Fuel", amount: 22000 },
            { item: "Tooth Brush", amount: 650 },
            { item: "Pharmacy (ORS powder)", amount: 3400 },
            { item: "Lunch", amount: 2342 },
            { item: "Miscellaneous", amount: 700 }
        ];

        // Populate Table
        const ledgerBody = document.getElementById('ledgerBody');
        expenses.forEach(e => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500;">${e.item}</td>
                <td class="amount-col" style="text-align: right;">₹${e.amount.toLocaleString('en-IN')}</td>
            `;
            ledgerBody.appendChild(tr);
        });

        // Add ledger total row
        const total = expenses.reduce((sum, e) => sum + e.amount, 0);
        const trTotal = document.createElement('tr');
        trTotal.style.background = "rgba(244, 63, 94, 0.05)";
        trTotal.style.fontWeight = "bold";
        trTotal.innerHTML = `
            <td>TOTAL FUNDS DISBURSED</td>
            <td class="amount-col" style="text-align: right; border-top: 1.5px solid var(--border-color);">₹${total.toLocaleString('en-IN')}</td>
        `;
        ledgerBody.appendChild(trTotal);

        // Populate stats dynamically
        const categories = expenses.length;
        const avg = categories > 0 ? Math.round(total / categories) : 0;

        document.getElementById('statTotalDisbursed').textContent = `₹${total.toLocaleString('en-IN')}`;
        document.getElementById('statCategories').textContent = `${categories} Items`;
        document.getElementById('statAvgCost').textContent = `₹${avg.toLocaleString('en-IN')}`;

        // Chart.js Configuration
        const ctx = document.getElementById('expenseChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: expenses.map(e => e.item),
                datasets: [{
                    data: expenses.map(e => e.amount),
                    backgroundColor: [
                        '#ec4899', '#f43f5e', '#a855f7', '#6366f1', 
                        '#3b82f6', '#06b6d4', '#14b8a6', '#64748b'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#94a3b8',
                            font: { family: 'Plus Jakarta Sans', size: 10 }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
